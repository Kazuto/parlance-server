version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kazuto/parlance-server/gen
plugins:
  # Go code generation
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative

  # Connect RPC for Go
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen
    opt:
      - paths=source_relative
