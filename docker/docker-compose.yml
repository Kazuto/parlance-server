services:
  api:
    container_name: parlance-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - ENV=${ENV:-development}
      - PORT=${PORT:-8080}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-parlance}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-parlance}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - DEEPL_API_URL=${DEEPL_API_URL:-https://api.deepl.com/v2}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    networks:
      - parlance-network
    restart: unless-stopped

  postgres:
    container_name: parlance-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-parlance}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_DB=${DB_NAME:-parlance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - parlance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlance"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  parlance-network:
    driver: bridge
