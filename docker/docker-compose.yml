version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=parlance
      - DB_PASSWORD=secret
      - DB_NAME=parlance
      - DB_SSL_MODE=disable
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_EXPIRY=24h
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    networks:
      - parlance-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=parlance
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=parlance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - parlance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlance"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  parlance-network:
    driver: bridge
