name: Release PR

on:
  push:
    branches: [develop]
  # A new release changes the version the next one is calculated from
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Create or update release PR
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release PR
        uses: actions/github-script@v9
        with:
          script: |
            const MAIN = 'main';
            const DEVELOP = 'develop';
            const SECTIONS = {
              breaking: 'Breaking Changes',
              feat: 'Features',
              fix: 'Fixes',
              other: 'Other',
            };
            const { owner, repo } = context.repo;

            // Commits on develop that aren't on main yet
            const {
              data: { commits },
            } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${MAIN}...${DEVELOP}`,
            });

            // Map commits to the PRs that brought them in. A commit pushed directly is its own change.
            const changes = new Map();
            for (const { sha, commit, parents } of commits) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              const pr = prs.find((p) => p.merged_at && p.base.ref === DEVELOP);
              if (pr) {
                changes.set(pr.number, { title: pr.title, ref: `#${pr.number}`, body: pr.body ?? '' });
              } else if (parents.length === 1) {
                const [title, ...body] = commit.message.split('\n');
                changes.set(sha, { title, ref: sha.slice(0, 7), body: body.join('\n') });
              }
            }

            if (changes.size === 0) {
              core.info('Nothing to release');
              return;
            }

            const sectionOf = ({ title, body }) => {
              const [, type, bang] = title.match(/^(\w+)(?:\([^)]*\))?(!)?:/) ?? [];
              if (bang || /^BREAKING[ -]CHANGE:/m.test(body)) return 'breaking';
              const normalized = type?.toLowerCase();
              return ['feat', 'fix'].includes(normalized) ? normalized : 'other';
            };
            const grouped = Object.groupBy(changes.values(), sectionOf);

            let latest = 'v0.0.0';
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
              latest = data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const [major, minor, patch] = latest.replace(/^v/, '').split('.').map(Number);
            if (![major, minor, patch].every(Number.isInteger)) {
              throw new Error(`Latest release ${latest} is not in vX.Y.Z format`);
            }

            let version = `v${major}.${minor}.${patch + 1}`;
            if (grouped.breaking) version = `v${major + 1}.0.0`;
            else if (grouped.feat) version = `v${major}.${minor + 1}.0`;
            // release.yml reads the version back out of this title
            const title = `Release: ${version}`;

            // Uses a description's "Changes" section if it has one, otherwise all of it.
            // Headings are demoted to nest under the PR's own heading.
            const describe = (description) => {
              let inFence = false;
              const lines = description.split(/\r?\n/).map((text) => {
                if (/^\s*(```|~~~)/.test(text)) inFence = !inFence;
                const hashes = inFence ? null : text.match(/^(#{1,6})\s/);
                return { text, level: hashes ? hashes[1].length : 0 };
              });

              let selected = lines;
              const start = lines.findIndex((l) => l.level && /^#+\s+changes\s*$/i.test(l.text));
              if (start !== -1) {
                const end = lines.findIndex((l, i) => i > start && l.level && l.level <= lines[start].level);
                selected = lines.slice(start + 1, end === -1 ? undefined : end);
              }

              return selected
                .map((l) => (l.level ? l.text.replace(/^#+/, '#'.repeat(Math.min(l.level + 2, 6))) : l.text))
                .join('\n')
                .trim();
            };

            const render = (withDescriptions) => {
              const sections = Object.entries(SECTIONS)
                .filter(([key]) => grouped[key])
                .map(([key, heading]) =>
                  withDescriptions
                    ? [
                        `## ${heading}`,
                        ...grouped[key].map((c) => `### ${c.title} (${c.ref})\n\n${describe(c.body)}`.trim()),
                      ].join('\n\n')
                    : [`## ${heading}`, grouped[key].map((c) => `- ${c.title} (${c.ref})`).join('\n')].join('\n\n'),
                );

              return [
                '<!-- Generated by .github/workflows/release-pr.yml. Manual edits are overwritten on the next run. -->',
                ...sections,
              ].join('\n\n');
            };

            // GitHub rejects PR bodies longer than this, so a large release falls back to titles only
            const MAX_BODY = 65536;
            let body = render(true);
            if (body.length > MAX_BODY) {
              core.warning(`Changelog is ${body.length} characters, so descriptions were left out`);
              body = render(false);
            }

            const { data: open } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${DEVELOP}`,
              base: MAIN,
            });

            if (open.length > 0) {
              await github.rest.pulls.update({ owner, repo, pull_number: open[0].number, title, body });
              core.info(`Updated #${open[0].number}: ${title}`);
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head: DEVELOP,
                base: MAIN,
                title,
                body,
              });
              core.info(`Created #${created.number}: ${title}`);
            }
