name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Create release
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Create release and start its build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.pull_request.title }}
          NOTES: ${{ github.event.pull_request.body }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Release PR title is not in vX.Y.Z format, so no release was created"
            exit 0
          fi

          gh release create "$VERSION" --target "$TARGET" --title "$VERSION" --notes "$NOTES"

          # A tag created with GITHUB_TOKEN doesn't fire the tag push build-image.yml listens for,
          # but workflow_dispatch is exempt from that rule.
          gh workflow run build-image.yml --ref "$VERSION"
