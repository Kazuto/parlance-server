syntax = "proto3";
package parlance.v1;

import "parlance/v1/common.proto";

option go_package = "parlance/v1;parlance";

// Releases hold entries back from exports until they go out, e.g. the texts of a
// feature until its launch. Entries join releases through EntryService.
service ReleaseService {
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse);
  rpc UpdateRelease(UpdateReleaseRequest) returns (UpdateReleaseResponse);
  rpc DeleteRelease(DeleteReleaseRequest) returns (DeleteReleaseResponse);
  // Releases now, whether or not the release has a date.
  rpc PublishRelease(PublishReleaseRequest) returns (PublishReleaseResponse);
}

// Release holds its entries back from exports until it goes out: at release_at, or
// when published without one. An entry in several releases waits for all of them.
message Release {
  string id = 1;
  string name = 2;
  string description = 3;
  // When it goes out; unset holds the entries until it's published.
  optional string release_at = 4;
  // When it went out; unset while pending.
  optional string released_at = 5;
  int32 entry_count = 6;
  string created_at = 7;
  string updated_at = 8;
}

enum ReleaseState {
  RELEASE_STATE_UNSPECIFIED = 0;
  // Not released yet, including releases whose date passed but haven't gone out yet.
  RELEASE_STATE_PENDING = 1;
  RELEASE_STATE_RELEASED = 2;
}

// Lists pending releases first, by date with unscheduled ones last, then released
// ones, the latest first.
message ListReleasesRequest {
  PaginationRequest pagination = 1;
  // Only releases in this state; unspecified lists all.
  ReleaseState state = 2;
}

message ListReleasesResponse {
  repeated Release releases = 1;
  PaginationResponse pagination = 2;
}

message GetReleaseRequest {
  string id = 1;
}

message GetReleaseResponse {
  Release release = 1;
}

message CreateReleaseRequest {
  string name = 1;
  string description = 2;
  // RFC 3339; unset to hold the entries until it's published.
  optional string release_at = 3;
}

message CreateReleaseResponse {
  Release release = 1;
}

// The date only changes while the release is pending.
message UpdateReleaseRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  // RFC 3339
  optional string release_at = 4;
  // Removes the date, holding the entries until the release is published.
  bool clear_release_at = 5;
}

message UpdateReleaseResponse {
  Release release = 1;
}

// Deletes the release; a pending release's entries export again right away.
message DeleteReleaseRequest {
  string id = 1;
}

message DeleteReleaseResponse {}

message PublishReleaseRequest {
  string id = 1;
}

message PublishReleaseResponse {
  Release release = 1;
}
