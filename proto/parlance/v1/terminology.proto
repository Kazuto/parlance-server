syntax = "proto3";
package parlance.v1;

import "parlance/v1/common.proto";
import "parlance/v1/user.proto";
import "parlance/v1/definition.proto";

option go_package = "parlance/v1;parlance";

service TerminologyService {
  rpc ListTerminologies(ListTerminologiesRequest) returns (ListTerminologiesResponse);
  rpc GetTerminology(GetTerminologyRequest) returns (GetTerminologyResponse);
  rpc CreateTerminology(CreateTerminologyRequest) returns (CreateTerminologyResponse);
  rpc UpdateTerminology(UpdateTerminologyRequest) returns (UpdateTerminologyResponse);
  rpc DeleteTerminology(DeleteTerminologyRequest) returns (DeleteTerminologyResponse);
  rpc RestoreTerminology(RestoreTerminologyRequest) returns (RestoreTerminologyResponse);
  rpc GetDefinitionHistory(GetDefinitionHistoryRequest) returns (GetDefinitionHistoryResponse);
  rpc SuggestTerminologies(SuggestTerminologiesRequest) returns (SuggestTerminologiesResponse);
}

message Terminology {
  string id = 1;
  string term = 2;
  string description = 3;
  repeated Definition definitions = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
  string created_by = 8;
  string updated_by = 9;
}

message ListTerminologiesRequest {
  PaginationRequest pagination = 1;
  FilterRequest filter = 2;
}

message ListTerminologiesResponse {
  repeated Terminology terminologies = 1;
  PaginationResponse pagination = 2;
}

message GetTerminologyRequest {
  string id = 1;
}

message GetTerminologyResponse {
  Terminology terminology = 1;
}

message CreateTerminologyRequest {
  string term = 1;
  string description = 2;
}

message CreateTerminologyResponse {
  Terminology terminology = 1;
}

message UpdateTerminologyRequest {
  string id = 1;
  string term = 2;
  string description = 3;
}

message UpdateTerminologyResponse {
  Terminology terminology = 1;
}

message DeleteTerminologyRequest {
  string id = 1;
}

message DeleteTerminologyResponse {}

message RestoreTerminologyRequest {
  string id = 1;
}

message RestoreTerminologyResponse {
  Terminology terminology = 1;
}

message GetDefinitionHistoryRequest {
  string terminology_id = 1;
  PaginationRequest pagination = 2;
}

message GetDefinitionHistoryResponse {
  repeated DefinitionHistory history = 1;
  PaginationResponse pagination = 2;
}

message DefinitionHistory {
  string id = 1;
  string definition_id = 2;
  string locale_id = 3;
  string terminology_id = 4;
  string user_id = 5;
  string translation = 6;
  string action = 7;  // "created", "updated", "deleted"
  string changed_at = 8;
  User user = 9;
}

// Terminology suggestions for translation assistance
message SuggestTerminologiesRequest {
  string source_text = 1;        // Source text to analyze (e.g., "Delete logo and return to dashboard")
  string target_locale_id = 2;   // Target locale for suggestions
}

message SuggestTerminologiesResponse {
  repeated TerminologySuggestion suggestions = 1;
}

message TerminologySuggestion {
  Terminology terminology = 1;           // The terminology entry
  string target_translation = 2;         // What to use in target locale (e.g., "Logo" for de)
  repeated string matched_words = 3;     // Words that matched from source text (e.g., ["logo"])
}
