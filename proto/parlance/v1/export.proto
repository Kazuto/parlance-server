syntax = "proto3";
package parlance.v1;

import "parlance/v1/task.proto";

option go_package = "parlance/v1;parlance";

service ExportService {
  rpc ExportPhp(ExportPhpRequest) returns (ExportPhpResponse);
  rpc ExportJson(ExportJsonRequest) returns (ExportJsonResponse);
  rpc ExportPo(ExportPoRequest) returns (ExportPoResponse);
  rpc ExportZip(ExportZipRequest) returns (ExportZipResponse);
}

message ExportPhpRequest {
  string locale_code = 1;
  reserved 2;
  reserved "scope_id";
  repeated string scope_ids = 3;  // Export entries in any of these scopes; empty exports all
  bool include_drafts = 4;  // Also export drafts; by default only approved text
  // Narrows each scope to the entries with any of its selected tags; a scope none of
  // whose tags is selected exports whole. A tag selects its scope too.
  repeated string tag_ids = 5;
  // Also export entries pending releases hold back
  bool include_unreleased = 6;
}

message ExportPhpResponse {
  string format = 1;          // "php"
  string content = 2;         // Exported file content
  string filename = 3;        // Suggested filename
}

message ExportJsonRequest {
  string locale_code = 1;
  reserved 2;
  reserved "scope_id";
  repeated string scope_ids = 3;  // Export entries in any of these scopes; empty exports all
  bool include_drafts = 4;  // Also export drafts; by default only approved text
  // Narrows each scope to the entries with any of its selected tags; a scope none of
  // whose tags is selected exports whole. A tag selects its scope too.
  repeated string tag_ids = 5;
  // Also export entries pending releases hold back
  bool include_unreleased = 6;
}

message ExportJsonResponse {
  string format = 1;          // "json"
  string content = 2;         // Exported file content
  string filename = 3;        // Suggested filename
}

// UTF-8, singular key-based gettext PO export. msgid is the entry key.
message ExportPoRequest {
  string locale_code = 1;
  reserved 2;
  reserved "scope_id";
  repeated string scope_ids = 3;  // Export entries in any of these scopes; empty exports all
  bool include_drafts = 4;  // Also export drafts; by default only approved text
  // Narrows each scope to the entries with any of its selected tags; a scope none of
  // whose tags is selected exports whole. A tag selects its scope too.
  repeated string tag_ids = 5;
  // Also export entries pending releases hold back
  bool include_unreleased = 6;
}

message ExportPoResponse {
  string format = 1;  // "po"
  string content = 2;
  string filename = 3;
}

// Export languages as a ZIP archive. With scopes (or tags), each scope gets a folder
// of files in its default format, e.g. "backend/de.php"; without, the files lie flat.
message ExportZipRequest {
  repeated string scope_ids = 1;  // Export entries in any of these scopes; empty exports all
  bool include_drafts = 2;        // Also export drafts; by default only approved text
  // Narrows each scope's folder to the entries with any of its selected tags; a
  // scope none of whose tags is selected exports whole. A tag selects its scope too.
  repeated string tag_ids = 3;
  repeated string locale_ids = 4;  // Languages to export; empty exports all
  // The flat files' format, and that of scopes without a default; unspecified for JSON.
  ExportFormat format = 5;
  // Also export entries pending releases hold back
  bool include_unreleased = 6;
}

message ExportZipResponse {
  string format = 1;          // "zip"
  bytes content = 2;          // ZIP file content as bytes
  string filename = 3;        // Suggested filename (e.g., "translations-2024-10-18.zip")
}
