syntax = "proto3";
package parlance.v1;

import "parlance/v1/common.proto";

option go_package = "parlance/v1;parlance";

// Webhooks send events, such as approved translations, to other services as HTTP
// POST requests, right away or collected into digests on a schedule. Deliveries
// that fail are tried again for a few hours.
service WebhookService {
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // Sends a ping event right away, whether the webhook is enabled or not, and
  // returns the delivery.
  rpc TestWebhook(TestWebhookRequest) returns (TestWebhookResponse);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  rpc GetWebhookDelivery(GetWebhookDeliveryRequest) returns (GetWebhookDeliveryResponse);
  // Sends a delivery's event again right away, as a new delivery, and returns it.
  rpc RedeliverWebhookDelivery(RedeliverWebhookDeliveryRequest) returns (RedeliverWebhookDeliveryResponse);
}

enum WebhookEvent {
  WEBHOOK_EVENT_UNSPECIFIED = 0;
  // Translations approved in the editor or by an approving import.
  WEBHOOK_EVENT_TRANSLATIONS_APPROVED = 1;
  // Translations a reviewer sent back, with the reviewer's comment.
  WEBHOOK_EVENT_TRANSLATIONS_REJECTED = 2;
  // Entries created in the app or by an import.
  WEBHOOK_EVENT_ENTRIES_CREATED = 3;
  WEBHOOK_EVENT_TASK_RUN_SUCCEEDED = 4;
  WEBHOOK_EVENT_TASK_RUN_FAILED = 5;
  // Only sent by TestWebhook; webhooks can't subscribe to it.
  WEBHOOK_EVENT_PING = 6;
  // Translations that became drafts and wait for a reviewer: new or changed in the
  // editor, by machine translation, or by an import that doesn't approve.
  WEBHOOK_EVENT_TRANSLATIONS_AWAITING_APPROVAL = 7;
  // The events a webhook with a schedule collected; webhooks can't subscribe to it.
  WEBHOOK_EVENT_DIGEST = 8;
}

// How a webhook posts events.
enum WebhookFormat {
  WEBHOOK_FORMAT_UNSPECIFIED = 0;
  // The event as JSON, for your own services.
  WEBHOOK_FORMAT_JSON = 1;
  // A chat message as {"text": …}, for Slack and services taking its incoming
  // webhooks, such as Mattermost.
  WEBHOOK_FORMAT_SLACK = 2;
  // A chat message as Discord's webhooks take it.
  WEBHOOK_FORMAT_DISCORD = 3;
}

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  // Waiting for its first or next attempt.
  WEBHOOK_DELIVERY_STATUS_PENDING = 1;
  WEBHOOK_DELIVERY_STATUS_SUCCEEDED = 2;
  // Every attempt failed, or the webhook was turned off before it was delivered.
  WEBHOOK_DELIVERY_STATUS_FAILED = 3;
  // Waiting for the webhook's next digest, which takes it along.
  WEBHOOK_DELIVERY_STATUS_COLLECTED = 4;
}

message WebhookDelivery {
  string id = 1;
  string webhook_id = 2;
  WebhookEvent event = 3;
  WebhookDeliveryStatus status = 4;
  // Attempts made so far.
  int32 attempts = 5;
  // When a pending delivery is tried next.
  optional string next_attempt_at = 6;
  optional string last_attempt_at = 7;
  // The HTTP status of the last answer; 0 when there was none.
  int32 response_status = 8;
  // What went wrong in the last attempt.
  string error = 9;
  // How long the last attempt took.
  int32 duration_ms = 10;
  string created_at = 11;
  // The request body, as the webhook's format renders the event. Only
  // GetWebhookDelivery, TestWebhook and RedeliverWebhookDelivery send it.
  string payload = 12;
  // The start of the last answer's body, sent along with the payload.
  string response_body = 13;
}

message Webhook {
  string id = 1;
  string name = 2;
  // Where the events are posted.
  string url = 3;
  repeated WebhookEvent events = 4;
  bool enabled = 5;
  // Whether deliveries are signed. The secret itself is never sent back.
  bool has_secret = 6;
  // The newest delivery, if any.
  WebhookDelivery last_delivery = 7;
  string created_at = 8;
  string updated_at = 9;
  WebhookFormat format = 10;
  // A standard 5-field cron expression in UTC on which collected events are sent
  // as one digest; empty to send each event right away.
  string schedule = 11;
  // When the next digest goes out, while there is one.
  optional string next_digest_at = 12;
  // Events waiting for the next digest.
  int32 collected_count = 13;
}

// The events a webhook subscribes to. In an update, omit the field to keep them;
// send it to replace them.
message WebhookEventSelection {
  repeated WebhookEvent events = 1;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message CreateWebhookRequest {
  string name = 1;
  string url = 2;
  repeated WebhookEvent events = 3;
  bool enabled = 4;
  // Signs each delivery; empty for unsigned deliveries.
  string secret = 5;
  // Unspecified for JSON.
  WebhookFormat format = 6;
  string schedule = 7;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
}

message UpdateWebhookRequest {
  string id = 1;
  optional string name = 2;
  optional string url = 3;
  WebhookEventSelection events = 4;
  // Turning a webhook off fails its pending deliveries.
  optional bool enabled = 5;
  // An empty secret removes the stored one.
  optional string secret = 6;
  // Pending deliveries and redeliveries are sent in the new format.
  optional WebhookFormat format = 7;
  // Removing the schedule sends what was collected as a digest right away.
  optional string schedule = 8;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message TestWebhookRequest {
  string id = 1;
}

message TestWebhookResponse {
  WebhookDelivery delivery = 1;
}

message ListWebhookDeliveriesRequest {
  string webhook_id = 1;
  PaginationRequest pagination = 2;
}

message ListWebhookDeliveriesResponse {
  // Newest first, without payloads and response bodies.
  repeated WebhookDelivery deliveries = 1;
  PaginationResponse pagination = 2;
}

message GetWebhookDeliveryRequest {
  string id = 1;
}

message GetWebhookDeliveryResponse {
  WebhookDelivery delivery = 1;
}

message RedeliverWebhookDeliveryRequest {
  string id = 1;
}

message RedeliverWebhookDeliveryResponse {
  WebhookDelivery delivery = 1;
}
