syntax = "proto3";
package parlance.v1;

import "parlance/v1/common.proto";
import "parlance/v1/task.proto";

option go_package = "parlance/v1;parlance";

service ScopeService {
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
  rpc GetScope(GetScopeRequest) returns (GetScopeResponse);
  rpc CreateScope(CreateScopeRequest) returns (CreateScopeResponse);
  rpc UpdateScope(UpdateScopeRequest) returns (UpdateScopeResponse);
  rpc DeleteScope(DeleteScopeRequest) returns (DeleteScopeResponse);
  rpc RestoreScope(RestoreScopeRequest) returns (RestoreScopeResponse);

  // Entry-Scope relationship management
  rpc AddScopeToEntry(AddScopeToEntryRequest) returns (AddScopeToEntryResponse);
  rpc RemoveScopeFromEntry(RemoveScopeFromEntryRequest) returns (RemoveScopeFromEntryResponse);
  rpc GetEntryScopes(GetEntryScopesRequest) returns (GetEntryScopesResponse);

  // Tags group a scope's entries further, e.g. "onboarding" in "mobile"
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc UpdateTag(UpdateTagRequest) returns (UpdateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
}

message Scope {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string color = 5;  // Hex color code (e.g., "#FF5733")
  string created_at = 6;
  string updated_at = 7;
  string deleted_at = 8;
  // The scope's tags by name; only set by ListScopes and GetScope.
  repeated Tag tags = 9;
  // The format the scope's entries are exported in by default; unspecified for none.
  ExportFormat export_format = 10;
}

// Tag groups entries within a scope. An entry only carries tags of its scopes.
message Tag {
  string id = 1;
  string scope_id = 2;
  string name = 3;
  // Entries carrying the tag; only set by ListScopes and GetScope.
  int32 entry_count = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListScopesRequest {
  PaginationRequest pagination = 1;
  FilterRequest filter = 2;
}

message ListScopesResponse {
  repeated Scope scopes = 1;
  PaginationResponse pagination = 2;
}

message GetScopeRequest {
  string id = 1;
}

message GetScopeResponse {
  Scope scope = 1;
}

message CreateScopeRequest {
  string name = 1;
  string slug = 2;
  string description = 3;
  string color = 4;
  // Unspecified for none
  ExportFormat export_format = 5;
}

message CreateScopeResponse {
  Scope scope = 1;
}

message UpdateScopeRequest {
  string id = 1;
  optional string name = 2;
  optional string slug = 3;
  optional string description = 4;
  optional string color = 5;
  // Unspecified clears it
  optional ExportFormat export_format = 6;
}

message UpdateScopeResponse {
  Scope scope = 1;
}

message DeleteScopeRequest {
  string id = 1;
}

message DeleteScopeResponse {}

message RestoreScopeRequest {
  string id = 1;
}

message RestoreScopeResponse {
  Scope scope = 1;
}

// Entry-Scope relationship management
message AddScopeToEntryRequest {
  string entry_id = 1;
  string scope_id = 2;
}

message AddScopeToEntryResponse {}

message RemoveScopeFromEntryRequest {
  string entry_id = 1;
  string scope_id = 2;
}

message RemoveScopeFromEntryResponse {}

message GetEntryScopesRequest {
  string entry_id = 1;
}

message GetEntryScopesResponse {
  repeated Scope scopes = 1;
}

message CreateTagRequest {
  string scope_id = 1;
  string name = 2;
}

message CreateTagResponse {
  Tag tag = 1;
}

// A tag stays in its scope; only its name changes.
message UpdateTagRequest {
  string id = 1;
  optional string name = 2;
}

message UpdateTagResponse {
  Tag tag = 1;
}

// Deletes the tag and removes it from its entries.
message DeleteTagRequest {
  string id = 1;
}

message DeleteTagResponse {}
