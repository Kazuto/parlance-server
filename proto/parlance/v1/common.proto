syntax = "proto3";
package parlance.v1;

option go_package = "parlance/v1;parlance";

message PaginationRequest {
  int32 page = 1;
  int32 per_page = 2;
}

message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 per_page = 3;
  int32 total_pages = 4;
}

message FilterRequest {
  string search = 1;
  string sort = 2;
  string order = 3;
  bool include_deleted = 4;
}

message Empty {}

// Where a translation stands in review. Changing its text makes it a draft again.
enum ReviewStatus {
  REVIEW_STATUS_UNSPECIFIED = 0;
  REVIEW_STATUS_DRAFT = 1;
  REVIEW_STATUS_APPROVED = 2;
}

// Approving accepts a translation; rejecting keeps it a draft, with a comment.
enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_APPROVE = 1;
  REVIEW_DECISION_REJECT = 2;
}

// A set of related ids. In an update, omit the field to keep the current set;
// send it (even with no ids) to replace the set.
message IdSelection {
  repeated string ids = 1;
}

// A string map with presence. In an update, omit the field to keep the current
// values; send it (even empty) to replace them.
message StringMap {
  map<string, string> values = 1;
}
