syntax = "proto3";
package parlance.v1;

option go_package = "parlance/v1;parlance";

// Servers running a translation model. Machine translation spreads its requests
// over all enabled servers.
service TranslationServerService {
  rpc ListTranslationServers(ListTranslationServersRequest) returns (ListTranslationServersResponse);
  rpc CreateTranslationServer(CreateTranslationServerRequest) returns (CreateTranslationServerResponse);
  rpc UpdateTranslationServer(UpdateTranslationServerRequest) returns (UpdateTranslationServerResponse);
  rpc DeleteTranslationServer(DeleteTranslationServerRequest) returns (DeleteTranslationServerResponse);
  // Translates a short sample with one server, to check its settings.
  rpc TestTranslationServer(TestTranslationServerRequest) returns (TestTranslationServerResponse);
  // The style every machine translation is asked for.
  rpc GetTranslationSettings(GetTranslationSettingsRequest) returns (GetTranslationSettingsResponse);
  rpc UpdateTranslationSettings(UpdateTranslationSettingsRequest) returns (UpdateTranslationSettingsResponse);
}

message TranslationServer {
  string id = 1;
  string name = 2;
  // An OpenAI-compatible API, e.g. "http://llama:8080/v1".
  string base_url = 3;
  string model = 4;
  // The key itself is never sent back.
  bool has_api_key = 5;
  // How many requests the server takes at once.
  int32 max_concurrency = 6;
  bool enabled = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListTranslationServersRequest {}

message ListTranslationServersResponse {
  repeated TranslationServer translation_servers = 1;
}

message CreateTranslationServerRequest {
  string name = 1;
  string base_url = 2;
  string model = 3;
  string api_key = 4;
  int32 max_concurrency = 5;
  bool enabled = 6;
}

message CreateTranslationServerResponse {
  TranslationServer translation_server = 1;
}

message UpdateTranslationServerRequest {
  string id = 1;
  optional string name = 2;
  optional string base_url = 3;
  optional string model = 4;
  // An empty key removes the stored one.
  optional string api_key = 5;
  optional int32 max_concurrency = 6;
  optional bool enabled = 7;
}

message UpdateTranslationServerResponse {
  TranslationServer translation_server = 1;
}

message DeleteTranslationServerRequest {
  string id = 1;
}

message DeleteTranslationServerResponse {}

message TestTranslationServerRequest {
  string id = 1;
}

message TestTranslationServerResponse {
  bool ok = 1;
  // The sample's translation when ok.
  string translation = 2;
  // What went wrong when not ok, as the server reported it.
  string error = 3;
  int32 duration_ms = 4;
}

message TranslationSettings {
  // The style machine translations are asked for, e.g. "software user interface
  // text"; empty while the default is used. The form of address of each language
  // is added to it.
  string style = 1;
  // The style used while style is empty.
  string default_style = 2;
  // When the settings last changed, if ever.
  optional string updated_at = 3;
}

message GetTranslationSettingsRequest {}

message GetTranslationSettingsResponse {
  TranslationSettings settings = 1;
}

message UpdateTranslationSettingsRequest {
  // One line of at most 200 characters, without square brackets. Empty restores
  // the default.
  string style = 1;
}

message UpdateTranslationSettingsResponse {
  TranslationSettings settings = 1;
}
