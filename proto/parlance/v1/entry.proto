syntax = "proto3";
package parlance.v1;

import "parlance/v1/common.proto";
import "parlance/v1/scope.proto";
import "parlance/v1/localization.proto";
import "parlance/v1/release.proto";
import "parlance/v1/user.proto";

option go_package = "parlance/v1;parlance";

service EntryService {
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
  rpc CreateEntry(CreateEntryRequest) returns (CreateEntryResponse);
  rpc UpdateEntry(UpdateEntryRequest) returns (UpdateEntryResponse);
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteEntryResponse);
  rpc RestoreEntry(RestoreEntryRequest) returns (RestoreEntryResponse);
  rpc SearchEntries(SearchEntriesRequest) returns (SearchEntriesResponse);
  // Finds the entries whose default text is the same as or similar to a text, e.g.
  // to point out twins while the default text is being written.
  rpc SearchSimilarEntries(SearchSimilarEntriesRequest) returns (SearchSimilarEntriesResponse);
  rpc GetEntryHistory(GetEntryHistoryRequest) returns (GetEntryHistoryResponse);
  rpc UpdateEntriesScopes(UpdateEntriesScopesRequest) returns (UpdateEntriesScopesResponse);
  rpc UpdateEntriesTags(UpdateEntriesTagsRequest) returns (UpdateEntriesTagsResponse);
  rpc UpdateEntriesReleases(UpdateEntriesReleasesRequest) returns (UpdateEntriesReleasesResponse);
  // Counts the entries exports carry with approved texts now: adding them to a
  // release takes texts that may be live out of exports.
  rpc CountLiveEntries(CountLiveEntriesRequest) returns (CountLiveEntriesResponse);
  rpc DeleteEntries(DeleteEntriesRequest) returns (DeleteEntriesResponse);
}

message Entry {
  string id = 1;
  string key = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
  string deleted_at = 6;
  string created_by = 7;
  string updated_by = 8;
  repeated Localization localizations = 9;
  repeated Scope scopes = 10;  // Many-to-many relationship
  // Target locales without a saved translation; only set by ListEntries with summary.
  repeated string missing_locale_ids = 11;
  // The text in the default locale, shortened for previews; only set by ListEntries
  // with summary. Empty when the entry has none.
  string default_translation = 12;
  // Target locales whose translation is a draft; only set by ListEntries with summary.
  repeated string draft_locale_ids = 13;
  // Target locales whose translation is outdated; only set by ListEntries with summary.
  repeated string outdated_locale_ids = 14;
  // Tags of the entry's scopes it carries; not set by ListEntries with summary.
  repeated Tag tags = 15;
  // Pending releases holding the entry back from exports; not set by ListEntries
  // with summary.
  repeated Release releases = 16;
}

message ListEntriesRequest {
  string scope_id = 1;
  string locale_id = 2;
  PaginationRequest pagination = 3;
  FilterRequest filter = 4;
  // "", "missing", "complete", "review" (a draft awaits approval), "outdated" (the
  // default text changed since) or "check" (the QA checks flag a translation against
  // the default text, e.g. a lost placeholder) for the selected locales (all active
  // locales if empty).
  string translation_status = 5;
  repeated string target_locale_ids = 6;
  // Entries in any of these scopes; combined with scope_id when both are set.
  repeated string scope_ids = 7;
  // Keyset paging: pass the previous response's next_cursor to continue after it.
  // Requires the default key ordering; page and the total count are skipped.
  string cursor = 8;
  // Return only id, key, missing_locale_ids and default_translation instead of
  // localizations and scopes.
  bool summary = 9;
  // Only deleted entries, to restore them. Requires delete_entry.
  bool deleted_only = 10;
  // The locales translation_status checks, when they differ from target_locale_ids,
  // e.g. without the default locale shown as the source; target_locale_ids if empty.
  repeated string status_locale_ids = 11;
  // Narrows scopes to these of their tags: an entry matches when it carries one of
  // a scope's selected tags, or is in a selected scope none of whose tags is
  // selected. A tag selects its scope too.
  repeated string tag_ids = 12;
  // Entries in any of these releases
  repeated string release_ids = 13;
  // Only entries sharing their default text with another entry, or only those whose
  // shared text is translated differently. Twins are looked for among the entries
  // the scope, tag and release filters select, and listed together: by their
  // default text first, then in the requested order. Not with deleted_only.
  DuplicateFilter duplicates = 14;
}

// Texts are the same when they are equal ignoring case and surrounding space.
enum DuplicateFilter {
  DUPLICATE_FILTER_UNSPECIFIED = 0;  // All entries
  // Entries whose default text another entry has too
  DUPLICATE_FILTER_SAME_TEXT = 1;
  // Entries whose default text another entry has too, while the translations of
  // that text differ in one of the status locales (status_locale_ids, else
  // target_locale_ids, else all active locales). Blank translations don't count.
  DUPLICATE_FILTER_TRANSLATED_DIFFERENTLY = 2;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
  PaginationResponse pagination = 2;
  // Set when more entries follow in key order; empty on the last page.
  string next_cursor = 3;
}

message GetEntryRequest {
  string id = 1;
}

message GetEntryResponse {
  Entry entry = 1;
}

message CreateEntryRequest {
  string key = 1;
  reserved 2;
  reserved "scope_ids";
  string description = 3;
  IdSelection scopes = 4;
  // Tags of the entry's scopes
  IdSelection tags = 5;
  // Pending releases
  IdSelection releases = 6;
}

message CreateEntryResponse {
  Entry entry = 1;
}

message UpdateEntryRequest {
  string id = 1;
  optional string description = 2;
  optional string key = 3;
  IdSelection scopes = 4;
  // Replaces the tags when set; each must belong to one of the entry's scopes.
  // Changing scopes alone drops the tags of removed scopes.
  IdSelection tags = 5;
  // Replaces the pending releases when set; released ones stay as a record.
  IdSelection releases = 6;
}

message UpdateEntryResponse {
  Entry entry = 1;
}

// Adds and removes scopes on several entries at once. Scopes not listed are kept.
message UpdateEntriesScopesRequest {
  repeated string entry_ids = 1;
  repeated string add_scope_ids = 2;
  repeated string remove_scope_ids = 3;
}

message UpdateEntriesScopesResponse {}

// Adds and removes tags on several entries at once. Tags not listed are kept. Adding
// a tag adds its scope to entries not in it yet.
message UpdateEntriesTagsRequest {
  repeated string entry_ids = 1;
  repeated string add_tag_ids = 2;
  repeated string remove_tag_ids = 3;
}

message UpdateEntriesTagsResponse {}

// Adds entries to and removes them from releases. Releases not listed are kept;
// released releases can't change.
message UpdateEntriesReleasesRequest {
  repeated string entry_ids = 1;
  repeated string add_release_ids = 2;
  repeated string remove_release_ids = 3;
}

message UpdateEntriesReleasesResponse {}

message CountLiveEntriesRequest {
  repeated string entry_ids = 1;
}

message CountLiveEntriesResponse {
  int32 count = 1;
}

message DeleteEntryRequest {
  string id = 1;
}

message DeleteEntryResponse {}

message DeleteEntriesRequest {
  repeated string ids = 1;
}

message DeleteEntriesResponse {
  // Entries already deleted, or that don't exist, are skipped and not counted.
  int32 deleted_count = 1;
}

message RestoreEntryRequest {
  string id = 1;
}

message RestoreEntryResponse {
  Entry entry = 1;
}

message SearchEntriesRequest {
  string query = 1;
  PaginationRequest pagination = 2;
  string scope_id = 3;
}

message SearchEntriesResponse {
  repeated Entry entries = 1;
  PaginationResponse pagination = 2;
}

message SearchSimilarEntriesRequest {
  // A default-locale text, e.g. the one being edited with unsaved changes.
  string text = 1;
  // Optional: leave out this entry, e.g. the one being edited.
  string exclude_entry_id = 2;
  // At most this many entries: 5 when unset, never more than 20.
  int32 limit = 3;
}

message SimilarEntry {
  string entry_id = 1;
  string key = 2;
  // The entry's default-locale text.
  string text = 3;
  // How alike text is to the searched one, from 0.8 to 1: the share of characters
  // that stay when editing one into the other, ignoring case. 1 is the same text.
  float similarity = 4;
}

message SearchSimilarEntriesResponse {
  // The most similar first. Texts longer than 2000 characters list none.
  repeated SimilarEntry entries = 1;
  // How many entries have the same text, ignoring case and surrounding space, as
  // the duplicates filter compares them; may be more than entries lists.
  int32 same_text_count = 2;
}

message GetEntryHistoryRequest {
  string entry_id = 1;
  PaginationRequest pagination = 2;
  // Optional: only history of this locale
  string locale_id = 3;
  // Optional: only changes before this time, in RFC 3339, e.g. a translation's
  // outdated_at to get the default text it was based on.
  string before = 4;
}

message GetEntryHistoryResponse {
  repeated LocalizationHistory history = 1;
  PaginationResponse pagination = 2;
}

message LocalizationHistory {
  string id = 1;
  string localization_id = 2;
  string locale_id = 3;
  string entry_id = 4;
  string user_id = 5;
  string translation = 6;
  string action = 7;  // "created", "updated", "deleted", "approved", "rejected"
  string changed_at = 8;
  User user = 9;
  ReviewStatus status = 10;
  // The reviewer's comment on a rejection.
  string comment = 11;
}
